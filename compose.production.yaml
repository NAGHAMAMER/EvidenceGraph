name: evidencegraph-production

services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evidencegraph}
      POSTGRES_USER: ${POSTGRES_USER:-evidencegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready
          -U ${POSTGRES_USER:-evidencegraph}
          -d ${POSTGRES_DB:-evidencegraph}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  api:
    image: evidencegraph-api:production

    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}

    env_file:
      - .env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PORT: 8000
      EMBEDDING_CACHE_DIR: /opt/models/fastembed

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${API_PORT:-8000}:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/api/v1/health',
          timeout=10
          ).read()
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  frontend:
    image: evidencegraph-frontend:production

    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-5173}:80"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_data:
    name: evidencegraph_postgres_data
